name: Bot and dashboard syntax check

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "dashboard.html"
      - ".github/workflows/python-syntax.yml"
  pull_request:
    branches: [main]
    paths:
      - "bot.py"
      - "dashboard.html"
      - ".github/workflows/python-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile bot
        run: python -m py_compile bot.py
      - name: Extract inline dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("dashboard.html").read_text()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline dashboard JavaScript found")
          Path("/tmp/dashboard-inline.js").write_text("\n".join(scripts))
          PY
      - name: Check dashboard JavaScript
        run: node --check /tmp/dashboard-inline.js
