services:
  - type: web
    name: spiderbot-telegram
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: spiderbot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        value: "2026286017"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: STATE_FILE
        value: /var/data/state.json
